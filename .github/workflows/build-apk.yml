name: Build DOSIN SMART APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP if needed
        shell: bash
        run: |
          set -e

          if [ ! -f package.json ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "Project ZIP not found"
              exit 1
            fi

            mkdir -p .project
            unzip -q "$ZIP_FILE" -d .project

            cp -r .project/* ./
            cp -r .project/.[!.]* ./ 2>/dev/null || true
          fi

          test -f package.json
          test -f app.json
          test -f App.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DOSIN-SMART-demo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
